# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo.
# Host clippy covers both workspace crates; wasm clippy checks the Worker's targets.
# scripts/check.sh gates, split into required jobs; install is pinned and locked.
# Dependencies resolve from the committed registry lockfile. No sibling clones.
name: ci
'on':
  pull_request: null
  # the release workflow calls these jobs on a v* tag (release.yml)
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo test --locked --workspace --no-fail-fast
    - run: cargo test --locked --manifest-path tests/heap/Cargo.toml --release
    - run: cargo test --locked --manifest-path tests/compat/Cargo.toml --workspace
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo fmt -p bsv-storage-cloudflare -p parity -- --check
    - run: cargo fmt --manifest-path tests/heap/Cargo.toml -- --check
    - run: cargo fmt --manifest-path tests/compat/Cargo.toml -p compat -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo clippy --locked --workspace --all-targets -- -D warnings
    - run: cargo clippy --locked --manifest-path tests/heap/Cargo.toml --all-targets -- -D warnings
    - run: cargo clippy --locked --manifest-path tests/compat/Cargo.toml -p compat --all-targets -- -D warnings
    - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo check --locked --target wasm32-unknown-unknown
    - run: cargo install worker-build@0.8.4 --locked
    - run: worker-build --release
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Scrub the tree and every commit's added lines since the base (since the previous release tag on a tag)
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        base="${BASE_SHA:-}"
        if [ "${REF_TYPE:-}" = tag ]; then
          base=--tag
        elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          base=--all
        fi
        tools/scrub.sh "$base"
