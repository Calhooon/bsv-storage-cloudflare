# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo.
# Host clippy covers both workspace crates; wasm clippy checks the Worker's targets.
# scripts/check.sh gates, split into required jobs; install is pinned and locked.
# Dependencies resolve from the committed registry lockfile. No sibling clones.
name: ci
'on':
  pull_request: null
  # the release workflow calls these jobs on a v* tag (release.yml)
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo test --locked --workspace --no-fail-fast
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo fmt -p bsv-storage-cloudflare -p parity -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo clippy --locked --workspace --all-targets -- -D warnings
    - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo check --locked --target wasm32-unknown-unknown
    - run: cargo install worker-build@0.8.4 --locked
    - run: worker-build --release
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: tools/scrub.sh
