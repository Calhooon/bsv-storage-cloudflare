[package]
name = "bsv-storage-cloudflare"
version = "0.1.0"
edition = "2021"
description = "UHRP file-storage server on Cloudflare Workers. Protocol-compatible Rust/WASM port of @bsv/uhrp-storage-server (nanostore.babbage.systems)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/calhooon/bsv-storage-cloudflare"
readme = "README.md"
keywords = ["bsv", "uhrp", "cloudflare", "workers", "wasm"]
categories = ["web-programming", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.7", features = ["queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# SigV4 for R2 S3-compatible presigned URLs.
hmac = "0.12"

bsv-middleware-cloudflare = "0.1.2"
bsv-rs = { version = "0.3.7", features = ["auth", "wallet", "transaction", "script", "overlay", "wasm"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Parity harness — native binary that hits nanostore.babbage.systems and
# compares against the local worker. Kept as a workspace member so its
# native-only deps (reqwest, tokio runtime) do NOT leak into the
# wasm32-unknown-unknown build of the root crate. `cargo check --target
# wasm32-unknown-unknown` at the repo root only builds the root package
# unless `--workspace` is passed explicitly, so the wasm gate stays green.
[workspace]
members = ["tests/parity"]
