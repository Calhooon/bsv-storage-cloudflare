[package]
name = "bsv-storage-cloudflare"
version = "0.2.0"
edition = "2021"
description = "UHRP file-storage server on Cloudflare Workers. Protocol-compatible Rust/WASM port of @bsv/uhrp-storage-server (nanostore.babbage.systems)."
license = "MIT"
repository = "https://github.com/Calgooon/bsv-storage-cloudflare"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.8 to match bsv-middleware-cloudflare. Two simultaneous `worker` versions
# cannot coexist: middleware and Worker `Response`/`Env` types must match.
# Keep both on the same worker major version.
worker = { version = "0.8", features = ["queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

bsv-middleware-cloudflare = "=0.5.1"
bsv-rs = { version = "=0.4.5", features = ["auth", "wallet", "transaction", "script", "wasm"] }
# SigV4 for R2 S3-compatible presigned URLs (task #4).
hmac = "0.12"

# Overlay wire types — `TaggedBEEF` + `Steak` (via `bsv_rs::overlay::types`)
# are re-exported by `bsv_overlay_engine::types`. Consuming them here lets us
# drop our duplicate `OverlaySubmitResponse` / `OverlayTopicAdmission`
# and keep the UHRP advert submit wire-format in lockstep with
# `bsv-overlay-cloudflare`. Compiles cleanly on wasm32-unknown-unknown (the overlay
# crate is itself deployed as a CF Worker).
#
# `overlay-cloudflare::WorkerBroadcaster` is intentionally NOT pulled in
# here: its `broadcast_to_host` consumes the HTTP response without
# exposing the body, so we can't run the empty-`outputsToAdmit`
# rejection check on top. `src/overlay/mod.rs` replicates the same wire
# contract (headers + Uint8Array body + `/submit` path suffix) and adds
# the Steak-body check that the overlay's own `/submit` endpoint needs
# (it returns HTTP 200 + empty Steak on silent topic-manager rejection).
bsv-overlay-engine = "=0.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Parity harness — native binary that hits nanostore.babbage.systems and
# compares against the local worker. Kept as a workspace member so its
# native-only deps (reqwest, tokio runtime, similar) do NOT leak into the
# wasm32-unknown-unknown build of the root crate. `cargo check --target
# wasm32-unknown-unknown` at the repo root only builds the root package
# unless `--workspace` is passed explicitly, so the wasm gate remains green.
[workspace]
members = ["tests/parity"]
