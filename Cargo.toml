[package]
name = "bsv-storage-cloudflare"
version = "0.3.5"
edition = "2021"
description = "UHRP file-storage server on Cloudflare Workers. Protocol-compatible Rust/WASM port of @bsv/uhrp-storage-server (nanostore.babbage.systems)."
license = "MIT"
repository = "https://github.com/Calhooon/bsv-storage-cloudflare"
readme = "README.md"
keywords = ["bitcoin", "bsv", "uhrp", "cloudflare", "wasm"]
categories = ["cryptography::cryptocurrencies"]
# The sources, the build script and its helper, the lock (build.rs and
# src/health.rs read it), the wrangler template, the README, the licence and
# the changelog. Tests and fixtures stay in the repository.
include = [
    "src/**/*.rs",
    "build.rs",
    "build_versions.rs",
    "Cargo.lock",
    "wrangler.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.8 to match bsv-middleware-cloudflare. Two simultaneous `worker` versions
# cannot coexist: middleware and Worker `Response`/`Env` types must match.
# Keep both on the same worker major version.
worker = { version = "0.8", features = ["queue", "d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

# `d1-claims`: the payment prefix is claimed in the `CLAIMS` D1 database
# (`D1PrefixStore`, `payment_prefix_gate`).
bsv-middleware-cloudflare = { version = "=0.7.8", features = ["d1-claims"] }
bsv-rs = { version = "0.8.15", features = ["auth", "wallet", "transaction", "script", "overlay", "wasm"] }
# SigV4 for R2 S3-compatible presigned URLs (task #4).
hmac = "0.12"

# Overlay wire types: `TaggedBEEF` and `Steak` come from
# `bsv_rs::overlay::types` (the `overlay` feature), the same types
# bsv-overlay-cloudflare's engine re-exports, so the UHRP advert submit stays
# in lockstep with the overlay's wire format.
#
# `overlay-cloudflare::WorkerBroadcaster` is intentionally NOT pulled in
# here: its `broadcast_to_host` consumes the HTTP response without
# exposing the body, so we can't run the empty-`outputsToAdmit`
# rejection check on top. `src/overlay/mod.rs` replicates the same wire
# contract (headers + Uint8Array body + `/submit` path suffix) and adds
# the Steak-body check that the overlay's own `/submit` endpoint needs
# (it returns HTTP 200 + empty Steak on silent topic-manager rejection).

bsv-worker-build-info = "=0.1.0"

[build-dependencies]
bsv-worker-build-info = { version = "=0.1.0", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# The single-use stores' conformance kit, run against the paid routes' store
# (tests/claims_store.rs). Tests only: the Worker carries none of it.
bsv-middleware-core = { version = "0.4.7", features = ["conformance"] }

# The kit on SQLite runs natively only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Parity harness — native binary that hits nanostore.babbage.systems and
# compares against the local worker. Kept as a workspace member so its
# native-only deps (reqwest, tokio runtime, similar) do NOT leak into the
# wasm32-unknown-unknown build of the root crate. `cargo check --target
# wasm32-unknown-unknown` at the repo root only builds the root package
# unless `--workspace` is passed explicitly, so the wasm gate remains green.
[workspace]
members = ["tests/parity"]
exclude = ["tests/heap", "tests/compat"]
