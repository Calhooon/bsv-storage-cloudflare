# Heap measurements of the paid routes on the payment header (the storage's
# ceiling, then the payment middleware's door to the claim) and of the
# fan-out's subject read, with a counting allocator. A package of its own, outside the workspace: the
# allocator is the one `unsafe` in the tree, and the Worker's crates forbid
# `unsafe_code`. Its lock is the root lock's resolution (the same bsv-rs,
# middleware and serde versions).
#   cargo test --locked --manifest-path tests/heap/Cargo.toml --release
[package]
name = "heap"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[test]]
name = "payment_door"
path = "payment_door.rs"

[dev-dependencies]
bsv-storage-cloudflare = { path = "../.." }
bsv-middleware-cloudflare = "=0.7.5"
bsv-rs = { version = "0.8.13", features = ["auth", "wallet", "transaction", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"

[workspace]
