# The paid routes' store (src/claims.rs, mounted as it is) on workerd's D1 and
# KV, exposed over HTTP to ../run.mjs (Miniflare). A package of its own,
# outside the workspace; never published.
#   worker-build --release   (worker-build 0.8.4, in this directory)
[package]
name = "claims-kit-worker"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bsv-middleware-cloudflare = { version = "=0.7.5", features = ["d1-claims"] }
bsv-middleware-core = { version = "0.4.4", features = ["conformance"] }
worker = { version = "0.8", features = ["d1"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"

[workspace]
