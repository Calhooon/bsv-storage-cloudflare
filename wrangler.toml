name = "bsv-storage-cloudflare"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
# account_id = "<your-cloudflare-account-id>"

# Custom domain — configure after initial deploy
# routes = [
#   { pattern = "storage.example.com", custom_domain = true }
# ]

[vars]
BSV_NETWORK = "mainnet"
WALLET_STORAGE_URL = "https://wallet-infra.x402agency.com"
# Overlay submit HOST (no `/submit` suffix). Our `WorkerBroadcaster`-style
# submit appends `/submit` itself; setting `...foo/submit` here would
# silently produce `...foo/submit/submit` and 404 every advert.
# rust-overlay at dev-a3e.workers.dev now registers tm_uhrp + ls_uhrp
# (see rust-overlay commit feat(uhrp): tm_uhrp + ls_uhrp topic manager
# and lookup service). Adverts go there instead of bsvb.tech so the
# round-trip is entirely Calgooon-owned. overlay-us-1.bsvb.tech remains
# in `bsv_rs::overlay::types::DEFAULT_MAINNET_TRACKERS` as a fallback
# SLAP tracker but is no longer our primary submit target.
OVERLAY_SUBMIT_URL = "https://your-worker.your-account.workers.dev"
# Public base URL for UHRP file downloads. Set to an R2 custom domain for
# production. For the initial deploy we use Cloudflare's auto-generated
# r2.dev public URL for bucket `uhrp-prod` (enabled via
# `wrangler r2 bucket dev-url enable uhrp-prod`).
PUBLIC_URL_BASE = "https://pub-0c965344954142909622d4c2aed91f87.r2.dev"
# R2 S3-compat API endpoint host used by the /upload SigV4 presigner
# (task #4). Format: `<ACCOUNT_ID>.r2.cloudflarestorage.com`.
R2_S3_ENDPOINT_HOST = "ea3e6d176ed3893258fe34281f710c7f.r2.cloudflarestorage.com"
# R2 bucket name (mirrors the `UHRP_FILES` r2_buckets binding below).
# Set here as a var because SigV4 needs the name in the presigned URL path.
R2_BUCKET = "uhrp-prod"
# Monthly USD price per GB (string-parsed to f64). See PROTOCOL.md §D.
# Diverges from nanostore ($0.03) — R2's zero-egress advantage is pocketed as
# margin. At $0.05 we profit $0.035/GB-mo (vs $0.015 at parity pricing).
PRICE_PER_GB_MO = "0.05"
# Minimum retention in minutes (integer). 0 = no floor. See PROTOCOL.md §1.
# nanostore.babbage.systems uses "15" — matching for wire parity on error strings.
MIN_HOSTING_MINUTES = "15"

[build]
command = "worker-build --release"

# Cross-worker invocation. CF returns error 1042 on Worker→Worker *.workers.dev
# fetches (the "fetch to a workers.dev URL from a Worker is restricted" path).
# A service binding uses CF's internal RPC rail instead of the public HTTPS
# edge, so it's the canonical solution. Pinned to the `rust-overlay` Worker
# on the same account — both run under dev@calhounjohn.com / account
# ea3e6d176ed3893258fe34281f710c7f.
[[services]]
binding = "OVERLAY"
service = "rust-overlay"

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "<your-account-id>"

[[r2_buckets]]
binding = "UHRP_FILES"
bucket_name = "uhrp-prod"

# Queue consumer for post-upload work (R2 event → tm_uhrp advert + indexing).
# The R2 bucket `uhrp-prod` must be configured (dashboard or wrangler) to
# emit PutObject/CompleteMultipartUpload events onto the `uhrp-post-upload`
# queue. The consumer handler lives in `src/lib.rs` (#[event(queue)]);
# processing is in `src/queue/mod.rs`.
#
# max_batch_size=10 + max_batch_timeout=30s is a conservative default: each
# message triggers a full wallet-infra + overlay round-trip (~3-5s wall time),
# so larger batches risk hitting the 30s Worker CPU cap under burst load.
# The producer binding is kept for manual enqueue fallback (tests, reprocess
# tooling) even though the primary writer is R2 itself.
[[queues.producers]]
binding = "POST_UPLOAD_QUEUE"
queue = "uhrp-post-upload"

[[queues.consumers]]
queue = "uhrp-post-upload"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Secrets (set via `npx wrangler secret put <NAME>`):
#   SERVER_PRIVATE_KEY       — BRC-31 server identity (hex)
#   ADMIN_WALLET_PRIVATE_KEY — signs PushDrop UHRP advertisements
#   ADMIN_IDENTITY_KEYS      — comma-separated hex pubkeys allowed to call
#                              /advertise. Case-sensitive (lowercase). Whitespace
#                              around commas is trimmed; empty entries are
#                              ignored. Consumed by src/routes/advertise.rs.
#   R2_ACCESS_KEY_ID         — R2 S3-API access key (task #4 presigner)
#   R2_SECRET_ACCESS_KEY     — R2 S3-API secret key (task #4 presigner)

# OVERLAY_SUBMIT_URL (set above under [vars]): overlay HOST url (no path).
# Consumed by src/overlay/mod.rs for both /advertise and /renew. The Worker
# POSTs raw tx bytes to `{OVERLAY_SUBMIT_URL}/submit` with
# `X-Topics: ["tm_uhrp"]` for UHRP-advert admission.
